[package]
name = "sigmaos_kernel"
version = "0.1.0"
edition = "2021"
description = "Sovereign Rust microkernel core implementing thread scheduling, IPC primitives, and syscall dispatch"

[lib]
name = "sigmaos_kernel"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
