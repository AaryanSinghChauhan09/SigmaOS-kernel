[package]
name = "sigmaos-kernel"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "SigmaOS kernel with CPU architecture support, memory management, scheduler, syscall dispatch, signal handling"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-kernel"
readme = "README.md"
keywords = ["kernel", "os", "sigmaos", "x86_64", "aarch64"]
categories = ["os", "no-std"]

[dependencies]
# Core dependencies (MINIMAL DEPENDENCIES, YAGNI)
spin = "0.9"
volatile = "0.5"
sigmaos-klib = { path = "../SigmaOS-klib" }

[features]
default = ["std"]
std = []
no_std = []

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
